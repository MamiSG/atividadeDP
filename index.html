<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerenciador de RPG</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
    <img src="assets/penguin-warcraft-3.gif" alt="Pinguim guerreiro" id="penguin-gif">
    <img src="assets/WarcraftIII2024-Combat_Kobalts1.gif" alt="GIF retrô" class="gif-retro">
  <header>
    <h1>Gerenciador de Personagens de RPG</h1>
  </header>

  <main>
    <section class="formulario">
      <h2>Criar ou Editar Personagem</h2>
      <form id="personagemForm">
        <input type="hidden" id="personagemId">

        <label for="nome">Nome verdadeiro:</label>
        <input type="text" id="nome" required>

        <label for="nomeAventureiro">Nome de Aventureiro:</label>
        <input type="text" id="nomeAventureiro" required>

        <label for="classe">Classe:</label>
        <select id="classe" required>
          <option value="">Selecione</option>
          <option value="Guerreiro">Guerreiro</option>
          <option value="Mago">Mago</option>
          <option value="Arqueiro">Arqueiro</option>
          <option value="Bardo">Bardo</option>
          <option value="Ladino">Ladino</option>
        </select>

        <label for="forca">Força (0–10):</label>
        <input type="number" id="forca" min="0" max="10" required>

        <label for="defesa">Defesa (0–10):</label>
        <input type="number" id="defesa" min="0" max="10" required>

        <button type="submit">Salvar Personagem</button>
      </form>
    </section>

    <section class="lista">
      <h2>Lista de Personagens</h2>
      <div id="listaPersonagens"></div>
    </section>
  </main>

  <script src="script.js"></script>
  <script>
    const pinguim = document.getElementById("penguin-gif");
  
    let x = 100;
    let y = 100;
    let dx = 1;
    let dy = 1;
  
    const move = () => {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const pw = pinguim.offsetWidth;
      const ph = pinguim.offsetHeight;
  
      x += dx;
      y += dy;
  
      if (x + pw >= vw || x <= 0) dx = -dx;
      if (y + ph >= vh || y <= 0) dy = -dy;
  
      pinguim.style.left = x + "px";
      pinguim.style.top = y + "px";
  
      requestAnimationFrame(move);
    };
  
    move();
  </script>  
</body>
</html>
